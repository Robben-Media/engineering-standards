name: Live Node

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains package.json and the lockfile
        type: string
        required: false
        default: "."
      node-version:
        description: Node.js version when the lockfile is not Bun
        type: string
        required: false
        default: "22"
      bun-version:
        description: Bun version. Default is pinned for reproducibility; callers can override.
        type: string
        required: false
        default: "1.4.0"
      package-manager:
        description: Optional override when more than one supported lockfile exists. Accepts bun, pnpm, yarn, or npm.
        type: string
        required: false
        default: ""

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect package manager
        id: pm
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          # Keep in sync with scripts/detect-node-lockfile.sh
          # Inlined because workflow_call checkout is the caller repo.
          WD="${WORKING_DIRECTORY:-.}"
          PM="${PACKAGE_MANAGER:-}"
          while [ $# -gt 0 ]; do
            case "$1" in
              --working-directory) WD="$2"; shift 2 ;;
              --package-manager) PM="$2"; shift 2 ;;
              *) echo "Unknown argument: $1" >&2; exit 2 ;;
            esac
          done
          WD="${WD%/}"; WD="${WD#./}"; [ -z "$WD" ] && WD="."
          PM="$(printf "%s" "$PM" | tr "[:upper:]" "[:lower:]" | tr -d "[:space:]")"
          [ -d "$WD" ] || { echo "working-directory does not exist: $WD" >&2; exit 1; }
          if [ -n "$PM" ]; then
            case "$PM" in
              bun|pnpm|yarn|npm) ;;
              *) echo "Invalid package-manager: $PM" >&2; exit 1 ;;
            esac
          fi
          found=""
          count=0
          if [ -n "$PM" ]; then
            case "$PM" in
              bun) cands="bun.lock bun.lockb" ;;
              pnpm) cands="pnpm-lock.yaml" ;;
              yarn) cands="yarn.lock" ;;
              npm) cands="package-lock.json" ;;
            esac
          else
            cands="bun.lock bun.lockb pnpm-lock.yaml yarn.lock package-lock.json"
          fi
          for lf in $cands; do
            if [ -f "$WD/$lf" ]; then found="$found $lf"; count=$((count+1)); fi
          done
          found="${found# }"
          if [ "$count" -eq 0 ]; then
            if [ -n "$PM" ]; then echo "package-manager=$PM but no matching lockfile in $WD" >&2
            else echo "No supported lockfile in $WD" >&2; fi
            exit 1
          fi
          if [ -z "$PM" ] && [ "$count" -gt 1 ]; then
            echo "Multiple lockfiles found in $WD: $found" >&2
            echo "Pass package-manager (bun|pnpm|yarn|npm) to disambiguate." >&2
            exit 1
          fi
          lockfile="${found%% *}"
          case "$lockfile" in
            bun.lock|bun.lockb) name=bun ;;
            pnpm-lock.yaml) name=pnpm ;;
            yarn.lock) name=yarn ;;
            package-lock.json) name=npm ;;
          esac
          if [ "$WD" = "." ]; then path="$lockfile"; else path="$WD/$lockfile"; fi
          echo "Detected package manager: $name"
          echo "Detected lockfile: $lockfile"
          echo "Detected lockfile path: $path"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            { echo "name=$name"; echo "lockfile=$lockfile"; echo "lockfile-path=$path"; } >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name"
          echo "lockfile=$lockfile"
          echo "lockfile-path=$path"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.pm.outputs.name == 'bun'
        with:
          bun-version: ${{ inputs.bun-version }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.pm.outputs.name == 'pnpm'
        with:
          run_install: false
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.pm.outputs.name != 'bun'
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.name }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile-path }}

      - name: Enable Corepack
        if: steps.pm.outputs.name == 'yarn'
        run: corepack enable

      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          case "${{ steps.pm.outputs.name }}" in
          bun) bun install --frozen-lockfile ;;
          pnpm) pnpm install --frozen-lockfile ;;
          yarn)
              yarn_major=$(yarn --version | cut -d. -f1)
              if [ "$yarn_major" -eq 1 ]; then
                yarn install --frozen-lockfile
              else
                yarn install --immutable
              fi
              ;;
          npm) npm ci ;;
          esac

      - name: Run CI contract
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          # Contract: package.json ci script. Fallback and fail-clearly: docs/classes.md
          PM="${{ steps.pm.outputs.name }}"

          has_script() {
            node -e "process.exit((require('./package.json').scripts||{})[process.argv[1]]?0:1)" "$1"
          }

          has_test_star() {
            node -e "const s=require('./package.json').scripts||{}; process.exit(Object.keys(s).some(k=>k.startsWith('test:'))?0:1)"
          }

          run_script() {
            local name="$1"
            case "$PM" in
              bun) bun run "$name" ;;
              pnpm) pnpm run "$name" ;;
              yarn) yarn "$name" ;;
              npm)
                if [ "$name" = "test" ]; then
                  npm test
                else
                  npm run "$name"
                fi
                ;;
              *)
                echo "Unknown package manager: $PM" >&2
                exit 1
                ;;
            esac
          }

          has_node_source() {
            find . \
              \( -path './node_modules' -o -path './.git' -o -path './dist' -o -path './build' \
                 -o -path './coverage' -o -path './.next' -o -path './.astro' -o -path './.output' \
                 -o -path './out' -o -path './vendor' \) -prune -o \
              -type f \( \
                -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \
                -o -name '*.mjs' -o -name '*.cjs' -o -name '*.mts' -o -name '*.cts' \
                -o -name '*.astro' -o -name '*.vue' -o -name '*.svelte' \
              \) \
              ! -name '*.config.js' ! -name '*.config.ts' ! -name '*.config.mjs' \
              ! -name '*.config.cjs' ! -name '*.config.mts' ! -name '*.config.cts' \
              ! -name 'eslint.config.js' ! -name 'eslint.config.ts' ! -name 'eslint.config.mjs' \
              ! -name 'eslint.config.cjs' \
              -print -quit | grep -q .
          }

          fail_missing_contract() {
            echo "This repository has application source but no CI contract and no fallback checks." >&2
            echo "Add a ci script to package.json (lint/typecheck/test/build scripts are the fallback)." >&2
            echo "See docs/classes.md in Robben-Media/engineering-standards." >&2
            exit 1
          }

          if has_script ci; then
            echo "CI contract: $PM run ci"
            run_script ci
            exit 0
          fi

          if ! has_node_source; then
            echo "No application source and no ci script; treating as caller-less lockfile scaffold. Skipping checks."
            echo "See docs/classes.md in Robben-Media/engineering-standards."
            exit 0
          fi

          ran=0

          if has_script lint; then
            echo "Fallback: lint"
            run_script lint
            ran=$((ran + 1))
          fi

          if has_script typecheck; then
            echo "Fallback: typecheck"
            run_script typecheck
            ran=$((ran + 1))
          fi

          if has_script test; then
            echo "Fallback: test"
            run_script test
            ran=$((ran + 1))
          elif [ "$PM" = "bun" ] && ! has_test_star; then
            echo "Fallback: bun test"
            bun test
            ran=$((ran + 1))
          fi

          if has_script build; then
            echo "Fallback: build"
            run_script build
            ran=$((ran + 1))
          fi

          if [ "$ran" -eq 0 ]; then
            fail_missing_contract
          fi
