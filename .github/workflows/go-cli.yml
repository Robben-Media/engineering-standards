name: Go CLI

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version
        type: string
        required: false
        default: "1.25.1"
      working-directory:
        description: Directory that contains go.mod
        type: string
        required: false
        default: "."

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require go.mod
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          test -f go.mod

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Download modules
        working-directory: ${{ inputs.working-directory }}
        run: go mod download

      - name: Format
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -f Makefile ] && grep -qE "^fmt-check:" Makefile; then
            make fmt-check
          else
            unformatted="$(gofmt -l .)"
            if [ -n "$unformatted" ]; then
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: Vet
        working-directory: ${{ inputs.working-directory }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -f Makefile ] && grep -qE "^test:" Makefile; then
            make test
          else
            go test ./...
          fi
