name: Python tool

on:
  workflow_call:
    inputs:
      python-version:
        description: CPython version
        type: string
        required: false
        default: "3.12"
      working-directory:
        description: Directory that contains pyproject.toml or requirements*.txt
        type: string
        required: false
        default: "."

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require a Python manifest
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ ! -f pyproject.toml ] && [ ! -f requirements.txt ] && [ ! -f requirements-test.txt ]; then
            echo "Expected pyproject.toml or requirements.txt" >&2
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ inputs.working-directory }}/requirements-test.txt
            ${{ inputs.working-directory }}/requirements.txt
            ${{ inputs.working-directory }}/pyproject.toml

      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then
            python -m pip install -r requirements-test.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          fi
          python -m pip install pytest

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -d tests ] || [ -d test ] || ls test_*.py *_test.py >/dev/null 2>&1; then
            python -m pytest
          else
            python -m compileall -q .
          fi
