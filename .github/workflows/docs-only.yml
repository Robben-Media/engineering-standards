name: Docs only

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan for class-drift app manifests
        type: string
        required: false
        default: "."

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Confirm docs-only
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          unexpected=""
          for f in go.mod package.json bun.lock bun.lockb pnpm-lock.yaml package-lock.json yarn.lock pyproject.toml requirements.txt requirements-test.txt Cargo.toml; do
            if [ -f "$f" ]; then
              unexpected="$unexpected $f"
            fi
          done
          if [ -n "$unexpected" ]; then
            echo "Repo has app manifests; it is no longer docs-only:$unexpected" >&2
            exit 1
          fi
